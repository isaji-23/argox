# Demo policy seeded into the local Collector by run.sh / seed_policy.py.
# RemotePolicyClient in server.py polls the merged bundle of every ACTIVE policy
# and enforces these rules on every agent call. Tweak it live from the
# dashboard's Policies screen to watch the SDK pick up changes within seconds.
#
# Supported operators (parser): eq, neq, gt, gte, lt, lte, contains, in.
# Metrics available per trigger:
#   on_input      -> prompt     (the user prompt, before the LLM)
#   on_output     -> output     (the final answer, before returning)
#   on_tool_call  -> tool_name  (each tool exposed on the agent)
# Actions: block (stop the run / strip the tool) or alert (flag, keep running).
id: argox-local-demo
status: active
created_by: argox-local-demo
rules:
  # ---------------------------------------------------------------------------
  # Input guards — evaluated against the prompt BEFORE it reaches the LLM.
  # ---------------------------------------------------------------------------
  - id: LOCAL-IN-01            # destructive intent
    trigger: on_input
    condition: { metric: prompt, operator: contains, threshold: nuke-the-prod }
    action: block

  - id: LOCAL-IN-02            # SQL injection attempt
    trigger: on_input
    condition: { metric: prompt, operator: contains, threshold: "drop table" }
    action: block

  - id: LOCAL-IN-03            # credential talk — flag, don't block
    trigger: on_input
    condition: { metric: prompt, operator: contains, threshold: password }
    action: alert

  - id: LOCAL-IN-04            # PII / sensitive HR topic — flag
    trigger: on_input
    condition: { metric: prompt, operator: contains, threshold: salary }
    action: alert

  # ---------------------------------------------------------------------------
  # Tool guards — evaluated for every tool exposed on the agent. Blocked tools
  # are stripped from agent.tools before the run; alerted tools stay available.
  # ---------------------------------------------------------------------------
  - id: LOCAL-TOOL-01          # secret access — strip the tool
    trigger: on_tool_call
    condition: { metric: tool_name, operator: eq, threshold: get_secret }
    action: block

  - id: LOCAL-TOOL-02          # knowledge-base access — allow but flag
    trigger: on_tool_call
    condition: { metric: tool_name, operator: eq, threshold: search_docs }
    action: alert

  # ---------------------------------------------------------------------------
  # Output guards — evaluated against the final answer BEFORE it is returned.
  # ---------------------------------------------------------------------------
  - id: LOCAL-OUT-01           # leaked stack trace — block
    trigger: on_output
    condition: { metric: output, operator: contains, threshold: STACK_TRACE }
    action: block

  - id: LOCAL-OUT-02           # leaked secret value (hunter2) — block
    trigger: on_output
    condition: { metric: output, operator: contains, threshold: hunter2 }
    action: block

  - id: LOCAL-OUT-03           # weather replies mention "sunny" — flag (demo)
    trigger: on_output
    condition: { metric: output, operator: contains, threshold: sunny }
    action: alert
