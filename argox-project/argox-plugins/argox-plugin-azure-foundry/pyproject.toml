[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argox-plugin-azure-foundry"
version = "0.1.0"
description = "Argox plugin for Azure AI Foundry Agent Service."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "argox-core>=0.1.0",
    "azure-ai-projects",
    "azure-identity",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.entry_points."argox.plugins"]
azure-foundry = "argox_azure_foundry:ArgoxAzureFoundryPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/argox_azure_foundry"]
