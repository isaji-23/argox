[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argox-plugin-langchain"
version = "0.1.0"
description = "Argox plugin for LangChain."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "argox-core>=0.1.0",
    "langchain-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.entry_points."argox.plugins"]
langchain = "argox_langchain:ArgoxLangChainPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/argox_langchain"]
